name: 每日新闻推送飞书
on:
  schedule:
    # UTC时间：北京时间10点=02点；20点=12点
    - cron: '0 2,12 * * *'
  workflow_dispatch:

jobs:
  run-news-job:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置JDK17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Maven编译打包
        run: mvn clean package -DskipTests

      - name: 执行新闻程序
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: java -jar target/daily-news-feishu-1.0-SNAPSHOT-jar-with-dependencies.jar
