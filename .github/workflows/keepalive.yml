name: Repository Keepalive
# cron：每月1号凌晨2点执行；UTC时间，对应国内上午10点
on:
  schedule:
    - cron: '0 2 1 * *'
  # 支持手动点按钮测试运行
  workflow_dispatch:

permissions:
  contents: write  # 必须！需要写仓库提交权限

jobs:
  keepalive-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update keepalive timestamp
        run: |
          # 写入当前UTC时间到.keepalive
          date -u > .keepalive
          git config user.name "GitHub‑Actions‑Bot"
          git config user.email "actions@github.com"

      - name: Commit & Push
        run: |
          git add .keepalive
          # 没有变更就不提交，避免空commit
          if git diff --cached --quiet; then
            echo "No changes, skip commit"
          else
            git commit -m "chore: keepalive update $(date -u -Iseconds)"
            git push
          fi
